name: API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-latest
    # Same image as docker-compose.yml, for the integration tests.
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # fastembed downloads the embedding models here on first use.
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ hashFiles('apps/api/uv.lock') }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
